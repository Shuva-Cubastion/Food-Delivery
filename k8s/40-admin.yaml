apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: tomato
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
        - name: admin
          image: ${ACR_LOGIN_SERVER}/tomato-admin:${IMAGE_TAG}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: tomato
spec:
  selector:
    app: admin
  ports:
    - port: 80
      targetPort: 8080
