apiVersion: v1
kind: Secret
metadata:
  name: tomato-secrets
  namespace: tomato
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: tomato
  MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD}"
  MONGO_URL: "mongodb://tomato:${MONGO_PASSWORD}@mongo:27017/food-del?authSource=admin"
  JWT_SECRET: "${JWT_SECRET}"
  SALT: "${SALT}"
  STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
